# docker-compose.override.yml — local dev overrides (auto-loaded by `docker compose`).
#
# Phase RM.5 — shared report archive volume.
#
# The report scheduler (svj_report_scheduler) writes generated PDFs to
# /var/lib/induvista/reports inside ITS container; Report Manager's download/
# preview runs in svj_backend and reads the same path. Without a shared volume
# those are two separate filesystems, so every scheduled report shows as
# MISSING in Report Manager (and is wiped on container restart).
#
# Mounting one named volume at that path in BOTH services makes scheduled
# files visible to the viewer and persistent across restarts. Compose MERGES
# these volume lists with the base file, so the existing ./backend/app mount
# is preserved.
#
# NOTE: if you point a report at a *custom* folder Destination in Report
# Config, set its target to a path under /var/lib/induvista/reports (or add
# another shared mount) so Report Manager can read it too. The default archive
# already lives on this volume.

services:
  backend:
    volumes:
      - svj_reports:/var/lib/induvista/reports
  report_scheduler:
    volumes:
      - svj_reports:/var/lib/induvista/reports

volumes:
  svj_reports:
